version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: datacleanai-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: datacleanai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datacleanai-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/datacleanai
      - SECRET_KEY=production_secret_key_datacleanai
      - MAX_UPLOAD_SIZE=1073741824
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data_store
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend SPA (Nginx Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: datacleanai-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
  backend_logs:
